server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    index index.php;

    client_max_body_size 50M;

    # Re-resolve the backend's address via Docker's DNS, so recreating the
    # backend container doesn't leave nginx pointing at a stale IP (502 errors).
    resolver 127.0.0.11 valid=10s;
    set $php_upstream backend:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Answers from a CPU-only LLM can take a while
        fastcgi_read_timeout 180s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
