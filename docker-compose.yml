name: law-assistant

x-backend: &backend
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: law-assistant-php:8.4
  volumes:
    - ./backend:/var/www/backend
    # Legal source documents for `php artisan law:ingest`
    - ./data:/var/www/data
  depends_on:
    db:
      condition: service_healthy
    ollama:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: law_assistant
      POSTGRES_USER: law
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law -d law_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # Keep the chat model loaded between questions (avoids reload delay)
      OLLAMA_KEEP_ALIVE: 30m
    restart: unless-stopped

  backend:
    <<: *backend

  worker:
    <<: *backend
    command: php artisan queue:work --tries=3 --timeout=300

  nginx:
    image: nginx:alpine
    ports:
      - "${API_HOST_PORT:-8090}:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://nginx
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - nginx

volumes:
  pgdata:
  ollama:
